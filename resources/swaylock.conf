# ZEN's lock screen theme.
#
# An unconfigured swaylock is a bare white panel with no indication of what it is
# or how to leave it, which is alarming rather than secure-looking. This gives it
# ZEN's ground colour and accent so it reads as part of the system.
#
# Installed to ~/.config/swaylock/config only if you do not already have one.

color=0b0c0e

font=sans
font-size=16

indicator-radius=96
indicator-thickness=6
indicator-caps-lock

inside-color=00000000
inside-clear-color=00000000
inside-ver-color=00000000
inside-wrong-color=00000000

line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
separator-color=00000000

ring-color=ffffff26
ring-clear-color=8fd18a
ring-ver-color=7fc8ff
ring-wrong-color=e06c75

key-hl-color=7fc8ff
bs-hl-color=e06c75

text-color=e8eaed
text-clear-color=e8eaed
text-ver-color=e8eaed
text-wrong-color=e8eaed

show-failed-attempts
ignore-empty-password
