# ZEN's kitty theme.
#
# background_opacity is what lets the glass material show. The palette matches
# the launcher and the focus ring.
#
# Installed to ~/.config/kitty/kitty.conf only if you do not already have one.

font_family      monospace
font_size        11.0

background_opacity 0.62
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

background       #0e1014
foreground       #e8eaed
cursor           #cfe6ff
cursor_text_color #0e1014

selection_foreground #ffffff
selection_background #32506b

color0  #1a1d24
color1  #e06c75
color2  #8fd18a
color3  #e5c07b
color4  #7fc8ff
color5  #c39ee0
color6  #6fd2d2
color7  #c7ccd4

color8  #3a3f4b
color9  #ff8b93
color10 #a9e0a3
color11 #f2d3a0
color12 #a3d9ff
color13 #d6b8ee
color14 #92e2e2
color15 #f0f2f5
