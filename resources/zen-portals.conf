[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;

# ZEN implements screencasting against xdg-desktop-portal-gnome specifically, which is
# what the xdp-gnome-screencast feature is named after. Naming it here rather than
# leaving it to `default` makes the requirement explicit: xdg-desktop-portal-gtk does
# not implement ScreenCast at all, so with only that installed OBS and every other
# capture tool finds no backend and records nothing.
org.freedesktop.impl.portal.ScreenCast=gnome;
