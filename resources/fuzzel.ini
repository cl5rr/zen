# ZEN's app launcher theme.
#
# fuzzel's stock look is a small grey box with a hairline border, which on a dark
# canvas reads as a dialog someone forgot to style. This makes it feel like part
# of the compositor: wide, dark, translucent, generously padded, with the same
# 12px corner radius windows use and an accent that matches the focus ring.
#
# Installed to ~/.config/fuzzel/fuzzel.ini only if you do not already have one.
# It is yours after that; ZEN will not overwrite it.

font=sans:size=13
dpi-aware=no
prompt=" "
icon-theme=Adwaita
icons-enabled=yes
fields=name,generic,exec
terminal=alacritty -e

# Roughly a third of a 1080p screen, centred a little above the middle, which is
# where the eye already is rather than dead centre.
width=34
lines=10
horizontal-pad=28
vertical-pad=22
inner-pad=12
line-height=26

# 12px to match geometry-corner-radius in ZEN's default window rule.
[border]
radius=12
width=1
color=ffffff14

[colors]
# aa alpha: translucent enough to read as glass over the wallpaper, opaque
# enough that text stays legible over a busy image.
background=12141aee
text=e8eaedff
prompt=8a90a0ff
placeholder=6b7280ff
input=e8eaedff
match=7fc8ffff
selection=7fc8ff26
selection-text=ffffffff
selection-match=7fc8ffff
counter=6b7280ff
border=ffffff14

[dmenu]
exit-immediately-if-empty=yes
