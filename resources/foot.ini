# ZEN's foot theme.
#
# The material only shows through pixels a client leaves translucent, so an
# opaque terminal sits on top of the glass and hides it entirely. alpha is the
# setting that matters; the palette matches the launcher and the focus ring.
#
# Installed to ~/.config/foot/foot.ini only if you do not already have one.

font=monospace:size=11
pad=14x12
dpi-aware=no

[colors]
alpha=0.62
background=0e1014
foreground=e8eaed

regular0=1a1d24
regular1=e06c75
regular2=8fd18a
regular3=e5c07b
regular4=7fc8ff
regular5=c39ee0
regular6=6fd2d2
regular7=c7ccd4

bright0=3a3f4b
bright1=ff8b93
bright2=a9e0a3
bright3=f2d3a0
bright4=a3d9ff
bright5=d6b8ee
bright6=92e2e2
bright7=f0f2f5

selection-foreground=ffffff
selection-background=32506b

[cursor]
style=beam
color=0e1014 cfe6ff

[main]
notify-focus-inhibit=no
